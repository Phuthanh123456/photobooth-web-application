services:
  - type: web
    name: cap-photobooth-photos
    runtime: static
    buildCommand: echo Guest site is ready
    staticPublishPath: cloud/guest
    headers:
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src blob: https://*.supabase.co; connect-src https://*.supabase.co; base-uri 'none'; frame-ancestors 'none'"
